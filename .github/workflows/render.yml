name: Render documentary

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npm run render

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final_video.mp4
          if-no-files-found: error
          retention-days: 14
