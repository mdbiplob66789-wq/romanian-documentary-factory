name: Render documentary

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID (e.g. video_002). Leave EMPTY to render legacy video_001.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/render.yml'

jobs:
  # ============================================================
  # LEGACY video_001 — не изменён НИ ОДНИМ символом относительно
  # рабочей версии. Запускается, когда project_id не передан
  # (в т.ч. на все push-триггеры, у которых inputs нет вовсе).
  # ============================================================
  render-legacy:
    if: ${{ github.event.inputs.project_id == '' || github.event.inputs.project_id == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Whisper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install openai-whisper

      - name: Align final Claude 160-shot map to Romanian voiceover
        run: python scripts/align_final.py

      - name: Stage render assets and enforce 160 unique shots
        run: |
          mkdir -p public/shots
          cp shot_*.jpg public/shots/ 2>/dev/null || true
          cp shot_*.png public/shots/ 2>/dev/null || true
          cp ElevenLabs_Kuki_combined.mp3 public/voiceover.mp3
          test "$(find public/shots -maxdepth 1 -type f \( -name 'shot_*.jpg' -o -name 'shot_*.png' \) | sed -E 's/.*shot_([0-9]{3})\.(jpg|png)/\1/' | sort -u | wc -l)" -eq 160

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Remotion dependencies
        run: npm install

      - name: Render full aligned Remotion master
        run: npm run render

      - name: Prepare single YouTube master
        run: |
          test -s out/final_video.mp4
          cp out/final_video.mp4 out/URME_RECI_FINAL_YOUTUBE.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/URME_RECI_FINAL_YOUTUBE.mp4

      - name: Upload alignment diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: alignment-report
          path: alignment_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload full Remotion master to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/URME_RECI_FINAL_YOUTUBE.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone for Google Drive delivery
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Verify Google Drive is reachable
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          if ! rclone lsd gdrive: ; then
            echo "::error::Google Drive недоступен через rclone remote 'gdrive'. Проверьте секрет RCLONE_CONFIG_BASE64."
            exit 1
          fi
          echo "Google Drive доступен, remote 'gdrive' подтверждён."

      - name: Upload one final MP4 directly to Google Drive
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          rclone copyto \
            out/URME_RECI_FINAL_YOUTUBE.mp4 \
            "gdrive:URME_RECI_FINAL_YOUTUBE.mp4" \
            --drive-chunk-size 128M \
            --transfers 1 \
            --checkers 4 \
            --stats 15s \
            --stats-one-line
          if ! rclone size "gdrive:URME_RECI_FINAL_YOUTUBE.mp4" ; then
            echo "::error::Не удалось подтвердить наличие файла на Google Drive после загрузки."
            exit 1
          fi
          echo "✅ Успешно загружено на Google Drive: URME_RECI_FINAL_YOUTUBE.mp4"

  # ============================================================
  # PRODUCTION pipeline video_002+ — project_id определяет всё.
  # Ни один шаг здесь не трогает video_001 (совсем другие файлы/пути).
  # Fail-fast: никаких `|| true` на критических шагах (п.24 ТЗ).
  # ============================================================
  render-project:
    if: ${{ github.event.inputs.project_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      PROJECT_ID: ${{ github.event.inputs.project_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate project (project.json / map.json / music_map.json / voiceover / music files)
        run: python scripts/check_project.py --project "$PROJECT_ID"

      - name: Install FFmpeg, Whisper, Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openai-whisper

      - name: Validate shots (project-scoped, strict prefix, no gaps, no duplicates, no corruption)
        run: python scripts/validate_shots.py --project "$PROJECT_ID"

      - name: Align voiceover (shots + music blocks, single Whisper pass)
        run: python scripts/align_project.py --project "$PROJECT_ID"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Remotion dependencies
        run: npm install

      - name: Stage assets for Remotion (strip project_id prefix, temp only)
        run: python scripts/stage_remotion.py --project "$PROJECT_ID"

      - name: Remotion render -> visual master (video + voice, no music yet)
        run: |
          npx remotion render src/index.jsx DocumentaryFull "out/${PROJECT_ID}_visual_master.mp4" \
            --props=render_props.json --codec=h264 --crf=20 --audio-bitrate=256k

      - name: Validate visual master (render_qc.json)
        run: python scripts/qc_visual.py --project "$PROJECT_ID"

      - name: Build audio master (music_map, fixed -20dB, 60s equal-power crossfade, no ducking)
        run: python scripts/build_audio.py --project "$PROJECT_ID"

      - name: Audio QC (audio_qc.json)
        run: python scripts/qc_audio.py --project "$PROJECT_ID"

      - name: Final QC (ffprobe + decode validation)
        run: python scripts/qc_final.py --project "$PROJECT_ID"

      - name: Clean Remotion staging
        if: always()
        run: python scripts/stage_remotion.py --clean

      - name: Upload final MP4 to GitHub (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_id }}-final-video
          path: out/${{ github.event.inputs.project_id }}_FINAL_YOUTUBE.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload QC reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_id }}-qc-reports
          path: |
            projects/${{ github.event.inputs.project_id }}/alignment_report.json
            projects/${{ github.event.inputs.project_id }}/render_qc.json
            projects/${{ github.event.inputs.project_id }}/audio_qc.json
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone for Google Drive delivery
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Verify Google Drive is reachable
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          if ! rclone lsd gdrive: ; then
            echo "::error::Google Drive недоступен через rclone remote 'gdrive'. Проверьте секрет RCLONE_CONFIG_BASE64."
            exit 1
          fi
          echo "Google Drive доступен, remote 'gdrive' подтверждён."

      - name: Upload project master to Google Drive (own folder per project)
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          DEST="gdrive:URME_RECI/${PROJECT_ID}/${PROJECT_ID}_FINAL_YOUTUBE.mp4"
          rclone copyto \
            "out/${PROJECT_ID}_FINAL_YOUTUBE.mp4" \
            "$DEST" \
            --drive-chunk-size 128M \
            --transfers 1 \
            --checkers 4 \
            --stats 15s \
            --stats-one-line
          if ! rclone size "$DEST" ; then
            echo "::error::Не удалось подтвердить наличие файла на Google Drive после загрузки."
            exit 1
          fi
          echo "✅ Успешно загружено на Google Drive: $DEST"
