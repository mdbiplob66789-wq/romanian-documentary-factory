name: Render documentary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Whisper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install openai-whisper

      - name: Align final Claude 160-shot map to Romanian voiceover
        run: python scripts/align_final.py

      - name: Stage render assets and enforce 160 unique shots
        run: |
          mkdir -p public/shots
          cp shot_*.jpg public/shots/ 2>/dev/null || true
          cp shot_*.png public/shots/ 2>/dev/null || true
          cp ElevenLabs_Kuki_combined.mp3 public/voiceover.mp3
          test "$(find public/shots -maxdepth 1 -type f \( -name 'shot_*.jpg' -o -name 'shot_*.png' \) | sed -E 's/.*shot_([0-9]{3})\.(jpg|png)/\1/' | sort -u | wc -l)" -eq 160

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Remotion dependencies
        run: npm install

      - name: Render full aligned Remotion master
        run: npm run render

      - name: Require Google Drive music source
        run: |
          if [ -z "$RCLONE_CONFIG_BASE64" ]; then
            echo "::error::RCLONE_CONFIG_BASE64 is required because the approved 8-track music library is stored on Google Drive."
            exit 1
          fi

      - name: Install rclone and verify Google Drive
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes
          rclone lsd gdrive:

      - name: Download approved 8-track music library
        run: |
          set -euo pipefail
          mkdir -p music_assets
          rclone copyto "gdrive:URME_RECI_MUSIC_atlasaudio-drone-ambient-518685.mp3" "music_assets/atlasaudio-drone-ambient-518685.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_mixkit-relax-658.mp3" "music_assets/mixkit-relax-658.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_mixkit-echoes-188.mp3" "music_assets/mixkit-echoes-188.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_tunetank-dark-ambient-soundscape-music-409350.mp3" "music_assets/tunetank-dark-ambient-soundscape-music-409350.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_the_mountain-dark-documentary-165604.mp3" "music_assets/the_mountain-dark-documentary-165604.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_arpmedia-dark-tension-569513.mp3" "music_assets/arpmedia-dark-tension-569513.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_mixkit-relax-beat-292.mp3" "music_assets/mixkit-relax-beat-292.mp3"
          rclone copyto "gdrive:URME_RECI_MUSIC_mixkit-discover-587.mp3" "music_assets/mixkit-discover-587.mp3"
          test "$(find music_assets -type f -name '*.mp3' | wc -l | tr -d ' ')" -eq 8
          echo "QC: all 8 approved music tracks downloaded."

      - name: Build constant background music mix
        run: python scripts/build_constant_music_mix.py

      - name: Prepare single YouTube master
        run: |
          set -euo pipefail
          test -s out/final_video_with_music.mp4
          cp out/final_video_with_music.mp4 out/URME_RECI_FINAL_YOUTUBE.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/URME_RECI_FINAL_YOUTUBE.mp4
          echo "FINAL MASTER: 160 shots + voiceover + approved 12-block music at constant -18 dB, ducking OFF"

      - name: Upload alignment diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: alignment-report
          path: alignment_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload final YouTube master to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/URME_RECI_FINAL_YOUTUBE.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload one final MP4 directly to Google Drive
        run: |
          set -euo pipefail
          rclone copyto \
            out/URME_RECI_FINAL_YOUTUBE.mp4 \
            "gdrive:URME_RECI_FINAL_YOUTUBE.mp4" \
            --drive-chunk-size 128M \
            --transfers 1 \
            --checkers 4 \
            --stats 15s \
            --stats-one-line
          rclone size "gdrive:URME_RECI_FINAL_YOUTUBE.mp4"
          echo "GOOGLE DRIVE UPLOAD OK: URME_RECI_FINAL_YOUTUBE.mp4"
