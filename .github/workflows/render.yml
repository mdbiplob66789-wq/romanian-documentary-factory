name: Render documentary

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID (e.g. video_002). Leave EMPTY to render legacy video_001.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/render.yml'

jobs:
  render-legacy:
    if: ${{ github.event.inputs.project_id == '' || github.event.inputs.project_id == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Whisper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          python -m pip install --upgrade pip
          python -m pip install openai-whisper

      - name: Align final Claude 160-shot map to Romanian voiceover
        run: python scripts/align_final.py

      - name: Stage render assets and enforce 160 unique shots
        run: |
          mkdir -p public/shots
          cp shot_*.jpg public/shots/ 2>/dev/null || true
          cp shot_*.png public/shots/ 2>/dev/null || true
          cp ElevenLabs_Kuki_combined.mp3 public/voiceover.mp3
          test "$(find public/shots -maxdepth 1 -type f \( -name 'shot_*.jpg' -o -name 'shot_*.png' \) | sed -E 's/.*shot_([0-9]{3})\.(jpg|png)/\1/' | sort -u | wc -l)" -eq 160

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Remotion dependencies
        run: npm install

      - name: Render full aligned Remotion visual master
        run: npm run render

      - name: Require and configure Google Drive
        run: |
          test -n "$RCLONE_CONFIG_BASE64" || (echo "::error::RCLONE_CONFIG_BASE64 is required" && exit 1)
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone lsd gdrive:

      - name: Download approved final 3-block music package
        run: |
          set -euo pipefail
          rm -rf music
          mkdir -p music
          rclone copyto \
            "gdrive:URME_RECI/video_001/video_001_music_blocks.zip" \
            "/tmp/video_001_music_blocks.zip"
          unzip -q /tmp/video_001_music_blocks.zip -d music
          test -s music/block_01.mp3
          test -s music/block_02.mp3
          test -s music/block_03.mp3
          echo "Music QC: block_01, block_02, block_03 present"

      - name: Build final audio according to Claude music_map v1
        run: python build_audio_video001.py

      - name: Final master QC
        run: |
          set -euo pipefail
          test -s out/video_001_FINAL_YOUTUBE.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,sample_rate,channels \
            -of json out/video_001_FINAL_YOUTUBE.mp4
          ffmpeg -v error -i out/video_001_FINAL_YOUTUBE.mp4 -f null -
          echo "FINAL QC PASS: 160 shots + voice + 3-block music; -20 dB vs target voice; ducking OFF; 60s equal-power crossfades"

      - name: Upload final master to GitHub backup
        uses: actions/upload-artifact@v4
        with:
          name: video-001-final-with-music
          path: out/video_001_FINAL_YOUTUBE.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload final master directly to Google Drive
        run: |
          set -euo pipefail
          DEST="gdrive:URME_RECI/video_001/video_001_FINAL_YOUTUBE.mp4"
          rclone copyto \
            out/video_001_FINAL_YOUTUBE.mp4 \
            "$DEST" \
            --drive-chunk-size 128M \
            --transfers 1 \
            --checkers 4 \
            --stats 15s \
            --stats-one-line
          rclone size "$DEST"
          echo "GOOGLE DRIVE UPLOAD OK: $DEST"

  render-project:
    if: ${{ github.event.inputs.project_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      PROJECT_ID: ${{ github.event.inputs.project_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate project
        run: python scripts/check_project.py --project "$PROJECT_ID"

      - name: Install FFmpeg, faster-whisper, Pillow (local-first stack, no Node)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate shots
        run: python scripts/validate_shots.py --project "$PROJECT_ID"

      - name: Align voiceover (faster-whisper, local-first, no Remotion/Node)
        run: python scripts/align_shots.py --project "$PROJECT_ID"

      - name: Render visual master (ffmpeg)
        run: python scripts/render_video.py --project "$PROJECT_ID"

      - name: Validate visual master
        run: python scripts/qc_visual.py --project "$PROJECT_ID"

      - name: Build audio master
        run: python scripts/build_audio.py --project "$PROJECT_ID"

      - name: Audio QC
        run: python scripts/qc_audio.py --project "$PROJECT_ID"

      - name: Final QC
        run: python scripts/qc_final.py --project "$PROJECT_ID"

      - name: Upload final MP4 to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_id }}-final-video
          path: projects/${{ github.event.inputs.project_id }}/output/${{ github.event.inputs.project_id }}_FINAL_YOUTUBE.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload QC reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_id }}-qc-reports
          path: |
            projects/${{ github.event.inputs.project_id }}/work/alignment_report.json
            projects/${{ github.event.inputs.project_id }}/qc/shot_qc.json
            projects/${{ github.event.inputs.project_id }}/qc/audio_qc.json
            projects/${{ github.event.inputs.project_id }}/qc/final_qc.json
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone for Google Drive delivery
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Verify Google Drive is reachable
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          if ! rclone lsd gdrive: ; then
            echo "::error::Google Drive недоступен через rclone remote 'gdrive'. Проверьте секрет RCLONE_CONFIG_BASE64."
            exit 1
          fi
          echo "Google Drive доступен, remote 'gdrive' подтверждён."

      - name: Upload project master to Google Drive
        if: ${{ env.RCLONE_CONFIG_BASE64 != '' }}
        run: |
          set -euo pipefail
          DEST="gdrive:URME_RECI/${PROJECT_ID}/${PROJECT_ID}_FINAL_YOUTUBE.mp4"
          rclone copyto \
            "projects/${PROJECT_ID}/output/${PROJECT_ID}_FINAL_YOUTUBE.mp4" \
            "$DEST" \
            --drive-chunk-size 128M \
            --transfers 1 \
            --checkers 4 \
            --stats 15s \
            --stats-one-line
          rclone size "$DEST"
          echo "GOOGLE DRIVE UPLOAD OK: $DEST"
